apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-emotion-detection-deployment
  namespace: 2401096
  labels:
    app: text-emotion-detection
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: text-emotion-detection
  template:
    metadata:
      labels:
        app: text-emotion-detection
        component: backend
    spec:
      imagePullSecrets:
        - name: nexus-registry-secret   # create this secret for your Nexus registry
      containers:
        - name: text-emotion-detection
          image: nexus-service-for-docker-hosted-registry.nexus.svc.cluster.local:8085/ajinkya-project/text-emotion-detection:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MODEL_PATH
              value: /app/model/text_emotion.pkl
            - name: LOG_LEVEL
              value: INFO
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: text-emotion-service
  namespace: 2401096
  labels:
    app: text-emotion-detection
spec:
  selector:
    app: text-emotion-detection
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
