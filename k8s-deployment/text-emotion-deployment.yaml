apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: text-emotion-static-pvc
  namespace: "2401096"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-emotion-detection-deployment
  namespace: "2401096"
  labels:
    app: text-emotion-detection
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-emotion-detection
  template:
    metadata:
      labels:
        app: text-emotion-detection
        component: backend
    spec:
      imagePullSecrets:
        - name: nexus-secret
      containers:
        - name: text-emotion-detection
          image: 127.0.0.1:30085/2401096-project/text-emotion-detection:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/model/text_emotion.pkl
            - name: LOG_LEVEL
              value: "INFO"
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: static-media
          persistentVolumeClaim:
            claimName: text-emotion-static-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: text-emotion-service
  namespace: "2401096"
  labels:
    app: text-emotion-detection
spec:
  selector:
    app: text-emotion-detection
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: text-emotion-ingress
  namespace: "2401096"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: textemotion.imcc.com  # update to your DNS
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: text-emotion-service
                port:
                  number: 8080
