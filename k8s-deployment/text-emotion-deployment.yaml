apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-emotion-detection-deployment
  namespace: 2401096
  labels:
    app: text-emotion-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-emotion-detection
  template:
    metadata:
      labels:
        app: text-emotion-detection
    spec:
      containers:
        - name: text-emotion-detection
          image: nexus-service-for-docker-hosted-registry.nexus.svc.cluster.local:8085/ajinkya-project/text-emotion-detection:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MODEL_PATH
              value: /app/model/text_emotion.pkl
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: text-emotion-service
  namespace: 2401096
spec:
  selector:
    app: text-emotion-detection
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
